<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img">
  <!-- DEMO CONTENT. The "after" half of the .compare pair on
       /papers/de-re-publica/: the same leaf as the 1928 edition sets it, with a
       line-number rail and an apparatus rule at the foot. -->
  <rect width="640" height="400" fill="#f5f1e6" />
  <rect x="0.5" y="0.5" width="639" height="399" fill="none" stroke="#d8d0bb" />

  <!-- running head and book number -->
  <g fill="#8d846c">
    <rect x="84" y="34" width="150" height="6" />
    <rect x="520" y="34" width="36" height="6" />
  </g>

  <!-- the line-number rail -->
  <g fill="#b3a98c">
    <rect x="52" y="82" width="14" height="4" />
    <rect x="52" y="126" width="14" height="4" />
    <rect x="52" y="170" width="14" height="4" />
    <rect x="52" y="214" width="14" height="4" />
    <rect x="52" y="258" width="14" height="4" />
  </g>

  <!-- the recovered text, set out -->
  <g fill="#3f3a2c">
    <rect x="84" y="78" width="472" height="7" />
    <rect x="84" y="100" width="472" height="7" />
    <rect x="84" y="122" width="440" height="7" />
    <rect x="84" y="144" width="472" height="7" />
    <rect x="84" y="166" width="398" height="7" />
    <rect x="104" y="196" width="452" height="7" />
    <rect x="84" y="218" width="472" height="7" />
    <rect x="84" y="240" width="472" height="7" />
    <rect x="84" y="262" width="334" height="7" />
  </g>

  <!-- the lacuna the palimpsest could not give back -->
  <g fill="#b3a98c">
    <rect x="84" y="284" width="96" height="7" />
    <rect x="196" y="284" width="8" height="7" />
    <rect x="212" y="284" width="8" height="7" />
    <rect x="228" y="284" width="8" height="7" />
    <rect x="252" y="284" width="140" height="7" />
  </g>

  <!-- apparatus criticus -->
  <rect x="84" y="320" width="472" height="1" fill="#c7bfa6" />
  <g fill="#8d846c">
    <rect x="84" y="334" width="472" height="4" />
    <rect x="84" y="350" width="472" height="4" />
    <rect x="84" y="366" width="286" height="4" />
  </g>
</svg>
