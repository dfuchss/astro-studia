# Refresh src/data/citations.yml from Google Scholar and commit it.
#
# OPT-IN, and on demand only. Uncomment the schedule to run it nightly.
#
# Two things to know before enabling it. It needs a PAT, for the same reason as
# update-github-metadata.yml: a push made with GITHUB_TOKEN triggers no other
# workflow, so the site would never rebuild. And Scholar rate-limits hard and
# has no API, so a run that cannot finish is routine rather than a failure —
# the timeout below is treated as success and the counts simply stay as they
# are until the next run.
#
# Set scholar_userid in src/data/socials.yml first, or the script exits saying so.
name: Update Scholar citations

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 0 * * *' # daily, midnight UTC

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # The whole point of the PAT is that its pushes trigger deploy.yml, which
      # a GITHUB_TOKEN push deliberately does not. Falling back to GITHUB_TOKEN
      # would leave this job green while the refreshed data silently stopped
      # reaching the live site, so an absent or expired PAT is a hard failure.
      #
      # Checked through env rather than `if: ${{ !secrets.PAT }}`: the secrets
      # context is not available in a step-level if, so that form would never
      # fire and the guard would not exist.
      - name: Require a PAT
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::secrets.PAT is not set. See the comment at the top of this file."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Fetch citations
        run: |
          set +e
          timeout --signal=TERM --kill-after=30 300 python -u scripts/update_scholar_citations.py
          code=$?
          # 124/137/143 are the timeout and its signals: Scholar rate-limited
          # us. Expected, not a failure — leave the data as it is.
          if [ $code -eq 124 ] || [ $code -eq 137 ] || [ $code -eq 143 ]; then
            echo "Scholar did not answer in time; leaving citations.yml unchanged."
            exit 0
          fi
          exit $code

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/citations.yml; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/citations.yml
          git commit -m "chore: refresh Scholar citations"
          git push
