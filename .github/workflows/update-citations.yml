# Refresh src/data/citations.yml from Google Scholar and commit it.
#
# OPT-IN, and on demand only: uncomment the schedule below to run it nightly.
# Needs scholar_userid in src/data/socials.yml, or the script exits saying so,
# and secrets.PAT — a push made with GITHUB_TOKEN triggers no other workflow, so
# the site would never rebuild. That secret is shared with docs.yml, which needs
# it to be a CLASSIC token with the `repo` scope. Scholar rate-limits hard and
# has no API, so the timeout below is treated as success and the counts simply
# stay as they are. docs/Deploying.md, "The two opt-in workflows".
name: Update Scholar citations

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 0 * * *' # daily, midnight UTC

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Checked through env: the secrets context is not available in a step-level
      # `if`, so `if: ${{ !secrets.PAT }}` would never fire. Hard failure rather
      # than a GITHUB_TOKEN fallback, which would leave this job green while the
      # refreshed data silently stopped reaching the site.
      - name: Require a PAT
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::secrets.PAT is not set. See the comment at the top of this file."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Fetch citations
        run: |
          set +e
          timeout --signal=TERM --kill-after=30 300 python -u scripts/update_scholar_citations.py
          code=$?
          # 124/137/143 are the timeout and its signals: Scholar rate-limited
          # us. Expected, not a failure — leave the data as it is.
          if [ $code -eq 124 ] || [ $code -eq 137 ] || [ $code -eq 143 ]; then
            echo "Scholar did not answer in time; leaving citations.yml unchanged."
            exit 0
          fi
          exit $code

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/citations.yml; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/citations.yml
          git commit -m "chore: refresh Scholar citations"
          git push
