name: Build, audit and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Formatting and type-checking run in this job rather than one of their
      # own: they need exactly the install that has already happened here.
      - name: Check formatting
        run: npx prettier . --check

      - name: Type-check
        run: npx astro check

      # The flags in src/features.ts and the table in docs/Features.md are both
      # generated from scripts/features.mjs. This also refuses a flag
      # combination that cannot build, which `astro check` cannot see: it
      # type-checks the module without executing it.
      - name: Check the generated regions are in sync
        run: npm run docs:check

      # Piped through grep because Astro reports a dangling content reference
      # with logger.error and then exits 0 — so the exit code on its own would
      # let a silently blank field ship. Switching a feature off empties its
      # collection, which is exactly how such a reference comes about.
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/build.log"
          if grep -qE 'Invalid content reference|does not exist or is empty' "$RUNNER_TEMP/build.log"; then
            echo "::error::the build logged a content-collection problem above, and still exited 0"
            exit 1
          fi

      # Structure, accessibility and the host files Pages needs. Before the
      # deploy step, so a regression fails the run instead of reaching the site.
      - name: Audit
        run: npm run audit

      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
