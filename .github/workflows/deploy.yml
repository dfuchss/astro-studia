name: Build, audit and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Formatting and type-checking run in this job rather than one of their
      # own: they need exactly the install that has already happened here.
      - name: Check formatting
        run: npx prettier . --check

      - name: Type-check
        run: npx astro check

      # The table in docs/Removing-Features.md is generated from
      # scripts/features.mjs. Guarded because `npm run init` offers to delete the
      # generator, and a CI step demanding a removed script would be a trap.
      - name: Check the generated docs are in sync
        if: hashFiles('scripts/gen-docs.mjs') != ''
        run: npm run docs:check

      - name: Build
        run: npm run build

      # Structure, accessibility and the host files Pages needs. Before the
      # deploy step, so a regression fails the run instead of reaching the site.
      - name: Audit
        run: npm run audit

      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
