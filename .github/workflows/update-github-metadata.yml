# Refresh src/data/github-metadata.json from the GitHub API and commit it.
#
# OPT-IN, and on demand only. Uncomment the schedule below to run it weekly.
#
# It needs a PAT rather than the built-in GITHUB_TOKEN: a push made with
# GITHUB_TOKEN does not trigger other workflows, so the commit would land and
# the site would never rebuild. This job needs no more than write access to the
# repository's contents — but the PAT secret is shared with docs.yml, which
# pushes to the wiki and so requires a CLASSIC token with the `repo` scope. Make
# it that one and all three workflows are covered; see docs/Deploying.md.
name: Update GitHub metadata

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 3 * * 1' # Mondays, 03:00 UTC
  push:
    paths: [src/data/repositories.yml]
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # The whole point of the PAT is that its pushes trigger deploy.yml, which
      # a GITHUB_TOKEN push deliberately does not. Falling back to GITHUB_TOKEN
      # would leave this job green while the refreshed data silently stopped
      # reaching the live site, so an absent or expired PAT is a hard failure.
      #
      # Checked through env rather than `if: ${{ !secrets.PAT }}`: the secrets
      # context is not available in a step-level if, so that form would never
      # fire and the guard would not exist.
      - name: Require a PAT
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::secrets.PAT is not set. See the comment at the top of this file."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Fetch metadata
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: npm run data:github

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/github-metadata.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/github-metadata.json
          git commit -m "chore: refresh GitHub metadata"
          git push
