# Refresh src/data/github-metadata.json from the GitHub API and commit it.
#
# Runs on demand and on a push to repositories.yml; uncomment the schedule below
# to add a weekly run. Needs secrets.PAT, not the built-in GITHUB_TOKEN, whose
# pushes trigger no other workflow — the commit would land and the site would
# never rebuild. Contents write is all this job wants, but the secret is shared
# with docs.yml, which needs a CLASSIC token with the `repo` scope.
# docs/Deploying.md, "The two opt-in workflows".
name: Update GitHub metadata

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 3 * * 1' # Mondays, 03:00 UTC
  push:
    paths: [src/data/repositories.yml]
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Checked through env: the secrets context is not available in a step-level
      # `if`, so `if: ${{ !secrets.PAT }}` would never fire. Hard failure rather
      # than a GITHUB_TOKEN fallback, which would leave this job green while the
      # refreshed data silently stopped reaching the site.
      - name: Require a PAT
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::secrets.PAT is not set. See the comment at the top of this file."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Fetch metadata
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: npm run data:github

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/github-metadata.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/github-metadata.json
          git commit -m "chore: refresh GitHub metadata"
          git push
