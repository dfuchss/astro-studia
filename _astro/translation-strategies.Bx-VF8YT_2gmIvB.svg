<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img"
     aria-label="Three strategies for moving a term between languages: borrow, calque, and reuse an existing word">
  <!-- DEMO FIGURE for a project page — the same drawing as the blog post's
       translation-layers.svg, filed under the projects feature so that pruning
       the blog does not take a projects figure with it. Carries its own
       background, so it needs no white plate — see the `plate` flag in
       src/content.config.ts. -->
  <defs>
    <linearGradient id="t-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171d28"/>
      <stop offset="100%" stop-color="#11151f"/>
    </linearGradient>
  </defs>
  <rect width="760" height="300" fill="url(#t-bg)"/>

  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="130" y="44" fill="#828d9f" font-size="12" letter-spacing="1.5">SOURCE</text>
    <text x="630" y="44" fill="#828d9f" font-size="12" letter-spacing="1.5">TARGET</text>
  </g>

  <g fill="none" stroke-width="2">
    <path d="M210 100h340" stroke="#5cc8e8" stroke-opacity="0.85"/>
    <path d="M210 160h340" stroke="#ad8cf2" stroke-opacity="0.85" stroke-dasharray="8 6"/>
    <path d="M210 220h340" stroke="#e0b364" stroke-opacity="0.85" stroke-dasharray="2 7"
          stroke-linecap="round"/>
  </g>

  <g fill="none" stroke-width="2">
    <circle cx="130" cy="160" r="46" stroke="#a4adbd" stroke-opacity="0.55"/>
    <circle cx="630" cy="100" r="30" stroke="#5cc8e8"/>
    <circle cx="630" cy="160" r="30" stroke="#ad8cf2"/>
    <circle cx="630" cy="220" r="30" stroke="#e0b364"/>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">
    <text x="130" y="165" fill="#edeff4" font-style="italic">ποιότης</text>
    <text x="630" y="105" fill="#5cc8e8">poiotes</text>
    <text x="630" y="165" fill="#ad8cf2">qualitas</text>
    <text x="630" y="225" fill="#e0b364">natura</text>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#828d9f" text-anchor="middle">
    <text x="380" y="92">borrow — cheap, and the reader pays the debt</text>
    <text x="380" y="152">calque — built from native parts, can be taken apart</text>
    <text x="380" y="212">reuse — riskiest: the word arrives carrying its past</text>
  </g>
</svg>
