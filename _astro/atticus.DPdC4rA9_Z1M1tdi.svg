<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="TPA">
  <!-- DEMO AVATAR. A monogram, so the repository ships no photographs of
       anyone. Replace with a portrait — a .jpg works the same way, because
       Astro's image pipeline reads the dimensions out of either. -->
  <defs>
    <radialGradient id="g-atticus" cx="32%" cy="26%" r="86%">
      <stop offset="0%" stop-color="#55d39a" stop-opacity="0.28"/>
      <stop offset="58%" stop-color="#55d39a" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#55d39a" stop-opacity="0.03"/>
    </radialGradient>
    <clipPath id="c-atticus"><circle cx="80" cy="80" r="80"/></clipPath>
  </defs>
  <g clip-path="url(#c-atticus)">
    <rect width="160" height="160" fill="#141a24"/>
    <rect width="160" height="160" fill="url(#g-atticus)"/>
    <g fill="none" stroke="#55d39a" stroke-opacity="0.16">
      <circle cx="80" cy="80" r="70"/>
      <circle cx="80" cy="80" r="54"/>
    </g>
    <!-- an arc that breaks the symmetry, so four of these in a row do not
         read as the same image repeated -->
    <path d="M80 8a72 72 0 0 1 0 144" fill="none" stroke="#55d39a" stroke-opacity="0.75"
          stroke-width="3" stroke-linecap="round"/>
    <text x="80" y="82" fill="#55d39a" font-family="Helvetica, Arial, sans-serif"
          font-size="34" font-weight="600" letter-spacing="1.5"
          text-anchor="middle" dominant-baseline="central">TPA</text>
    <circle cx="80" cy="80" r="79" fill="none" stroke="#55d39a" stroke-opacity="0.3" stroke-width="2"/>
  </g>
</svg>
