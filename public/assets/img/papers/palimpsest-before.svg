<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img">
  <!-- DEMO CONTENT. The "before" half of the .compare pair on
       /papers/de-re-publica/: the Vatican palimpsest, Cicero scraped off and
       Augustine written across it at right angles. Carries its own background,
       so the prose does not plate it. -->
  <rect width="640" height="400" fill="#e7ddc6" />
  <rect x="0.5" y="0.5" width="639" height="399" fill="none" stroke="#c9bb9c" />

  <!-- the underlying text, all but scraped away -->
  <g fill="#a99b7c" opacity="0.55">
    <rect x="44" y="40" width="552" height="5" />
    <rect x="44" y="62" width="552" height="5" />
    <rect x="44" y="84" width="530" height="5" />
    <rect x="44" y="106" width="552" height="5" />
    <rect x="44" y="128" width="498" height="5" />
    <rect x="44" y="150" width="552" height="5" />
    <rect x="44" y="172" width="552" height="5" />
    <rect x="44" y="194" width="512" height="5" />
    <rect x="44" y="216" width="552" height="5" />
    <rect x="44" y="238" width="552" height="5" />
    <rect x="44" y="260" width="470" height="5" />
    <rect x="44" y="282" width="552" height="5" />
    <rect x="44" y="304" width="552" height="5" />
    <rect x="44" y="326" width="406" height="5" />
  </g>

  <!-- Augustine on the Psalms, written over it the other way round -->
  <g fill="#5c5340" transform="rotate(90 320 200)">
    <rect x="130" y="102" width="340" height="7" />
    <rect x="130" y="130" width="340" height="7" />
    <rect x="130" y="158" width="316" height="7" />
    <rect x="130" y="186" width="340" height="7" />
    <rect x="130" y="214" width="340" height="7" />
    <rect x="130" y="242" width="288" height="7" />
    <rect x="130" y="270" width="340" height="7" />
    <rect x="130" y="298" width="340" height="7" />
    <rect x="130" y="326" width="254" height="7" />
  </g>

  <!-- foxing -->
  <g fill="#bda37a" opacity="0.35">
    <circle cx="96" cy="356" r="16" />
    <circle cx="556" cy="58" r="11" />
    <circle cx="512" cy="372" r="7" />
  </g>
</svg>
