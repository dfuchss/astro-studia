<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img"
     aria-label="The four sources of duty: wisdom, justice, greatness of spirit and propriety">
  <!-- DEMO FIGURE. This one carries its own background, so it is rendered with
       plate: false. Both cases exist in the demo because getting them the wrong
       way round is the usual figure bug on a dark site. -->
  <rect width="640" height="200" fill="#161c27"/>
  <g fill="none" stroke="#5cc8e8" stroke-width="1.6">
    <circle cx="96" cy="100" r="42"/>
    <circle cx="277" cy="100" r="42"/>
    <circle cx="458" cy="100" r="42"/>
    <circle cx="592" cy="100" r="30"/>
    <path d="M138 100h97 M319 100h97 M500 100h62"/>
  </g>
  <g fill="#edeff4" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">
    <text x="96" y="104">sapientia</text>
    <text x="277" y="104">iustitia</text>
    <text x="458" y="104">fortitudo</text>
    <text x="592" y="104">decorum</text>
  </g>
  <text x="320" y="180" fill="#a4adbd" font-family="Helvetica, Arial, sans-serif"
        font-size="11" text-anchor="middle">the four sources of officium (De Officiis I.15)</text>
</svg>
