<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img"
     aria-label="Placeholder portrait">
  <!-- DEMO PORTRAIT. Rendered as a circle on the home page, so the composition
       is centred and nothing sits near the corners.

       Replace it with a photograph: drop portrait.jpg into src/assets/ and
       change the import at the top of src/pages/index.astro. Astro's <Image>
       handles either, and emits width and height for both. -->
  <defs>
    <radialGradient id="p-bg" cx="50%" cy="34%" r="78%">
      <stop offset="0%" stop-color="#1e2733"/>
      <stop offset="62%" stop-color="#151b26"/>
      <stop offset="100%" stop-color="#0e121b"/>
    </radialGradient>
    <linearGradient id="p-fig" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#2b3a4d"/>
      <stop offset="100%" stop-color="#1b2431"/>
    </linearGradient>
    <linearGradient id="p-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5cc8e8" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#5cc8e8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#5cc8e8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="p-clip"><circle cx="160" cy="160" r="160"/></clipPath>
  </defs>

  <g clip-path="url(#p-clip)">
    <rect width="320" height="320" fill="url(#p-bg)"/>

    <!-- faint concentric rings, for depth behind the figure -->
    <g fill="none" stroke="#5cc8e8" stroke-opacity="0.07">
      <circle cx="160" cy="160" r="150"/>
      <circle cx="160" cy="160" r="122"/>
      <circle cx="160" cy="160" r="94"/>
    </g>

    <!-- shoulders, then head: filled shapes rather than line art, so the
         placeholder has some weight to it at 11rem -->
    <path d="M52 320c0-60 48-96 108-96s108 36 108 96z" fill="url(#p-fig)"/>
    <circle cx="160" cy="130" r="56" fill="url(#p-fig)"/>

    <!-- rim light down the left, which is what stops the silhouette reading
         as a hole in the page -->
    <path d="M52 320c0-60 48-96 108-96v22c-48 0-86 30-86 74z" fill="url(#p-rim)"/>
    <path d="M160 74a56 56 0 0 0-56 56 56 56 0 0 0 20 43 44 44 0 0 1-6-22 42 42 0 0 1 42-42z"
          fill="url(#p-rim)"/>

    <circle cx="160" cy="160" r="158" fill="none" stroke="#5cc8e8" stroke-opacity="0.22"
            stroke-width="2"/>
  </g>
</svg>
