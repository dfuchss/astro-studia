# The contact block: the rows under "Get in touch" on the home page, and the
# same rows on every other page that renders it. One list, rendered by
# src/components/Contact.astro, so a handle you add here appears in all of them
# without touching any markup.
#
# ── Why this is its own file and not part of cv.yml ────────────────────────
#
# Because the contact block outlives the CV. `npm run init -- --preset project`
# removes the `cv` feature, and that deletes src/data/cv.yml — while the home
# page it produces still has a contact section. Putting these rows in cv.yml
# would make "how do people reach us" a thing only a site with a CV may have,
# which is exactly backwards for a group or project site.
#
# ── A row ──────────────────────────────────────────────────────────────────
#
#   label   the left column. Set in mono, lowercase by convention.  (required)
#
#   Then EXACTLY ONE of:
#
#   value   the text of the row.
#   email   an address, rendered through src/components/Email.astro, which
#           splits and rot13s it so the address never appears in the served
#           bytes. `email: true` means SITE.email from src/consts.ts — use
#           that rather than writing the same address down twice.
#
#           A plain `value:` that looks like an address is a BUILD ERROR
#           naming this file, not a silently harvestable mailto. It has to be,
#           because `npm run audit` greps the built output for anything
#           address-shaped and fails the deploy — and finding that out from the
#           audit, after the fact, is the worse way to learn it.
#
#   href    makes the value a link. An absolute URL or a site-relative path.
#   mono    true sets the value in the monospace face — for a handle, an id,
#           a fingerprint: something read character by character rather than
#           as words.
#   note    a short muted tail after the value: "— for anything sensitive".
#
# Rows the site can DERIVE are not listed here, and appear below these ones:
# the PGP key id if socials.yml carries a `pgp_fingerprint`, the current
# position if there is a cv.yml. Facts the site already knows; a second copy
# here is how the two start disagreeing.
#
# DEMO CONTENT.

- label: email
  # true = SITE.email. Write an address instead for a second, different one.
  email: true

# The row that this file exists for. fuchss.org lists a Matrix handle, and
# before there was a list it had to be a hand-written <dl> row on the home page
# — which is also why it never appeared on /cv/ at all.
- label: matrix
  value: '@cicero:example.org'
  href: https://matrix.to/#/@cicero:example.org
  mono: true
  note: for anything that should not sit in a mailbox
