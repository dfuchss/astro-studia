# Profile links for SocialRow.astro, and the ids the data scripts need.
#
# Every field is optional: null (or a deleted line) means the chip for it does
# not render — that is how you drop a profile, not by editing the component.
#
# DEMO VALUES — replace them. The ORCID and GitHub ids are those services' own
# demo accounts, so nothing points at a real person's profile and nothing 404s.

orcid_id: 0000-0002-1825-0097

# The `user` parameter in your Scholar profile URL. Renders the Scholar chip,
# and tells scripts/update_scholar_citations.py whose citations to fetch. Left
# unset because Google Scholar has no placeholder account.
scholar_userid: null

github_username: octocat

dblp_url: null
linkedin_username: null

# Semantic Scholar's author id: the number in your profile URL.
semanticscholar_id: null

# Anything the fields above do not cover. `icon` may name one of the marks in
# components/SocialRow.astro — orcid, scholar, dblp, github, codeberg, linkedin,
# semanticscholar — and without one the entry renders as a text chip instead.
extra:
  - label: Codeberg
    url: https://codeberg.org/
    icon: codeberg
  - label: Perseus
    url: https://www.perseus.tufts.edu/

# Your PGP key fingerprint, no spaces. When set, /pgp-key/ renders it and
# SocialRow links there; when null, both quietly stand down. The exported public
# key goes at public/assets/pgp-key/<FINGERPRINT>.asc, which the page inlines
# too; with no such file it keeps the fingerprint and the download link, because
# publishing only a fingerprint is a supported choice. The key shipped here is a
# throwaway: nobody holds its secret half, so do not trust or encrypt to it.
# Replace it with yours and delete the .asc that came with it.
pgp_fingerprint: AEDD211D16871331224CEC5571C3DB09BA98F214
