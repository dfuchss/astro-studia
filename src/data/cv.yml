# The CV. /cv/ renders this file and nothing else. DEMO CONTENT.
#
# A section is a title, a heading and a list of entries, so adding "Service" or
# "Grants" is a new block here and no code. Page order is file order.
#
# Section fields:
#   layout  timeline | rows | cards | courses. Default: `timeline` (a date rail)
#           if any entry carries a date, else `rows`. `cards` is a grid of name,
#           "since" date and highlight chips (Projects); `courses` groups by
#           each entry's `semester`, earlier terms behind a disclosure.
#   count   a noun beside the heading — "Rhetorical instruction 24 courses".
#           Opt-in; "course|courses" for a section that may hold one.
#
# Entry fields, all optional but `title`:
#   title     what it was (required)
#   org       who it was with
#   url       link on the org, or on the title for `cards`
#   start     "2020-03", "2020", or anything else: a value that looks like a
#   end       date is formatted, anything else printed verbatim. A start with no
#             end is a single date, not an open range.
#   current   true renders "– present" and a `now` badge, and the contact
#             block's "where" row reads the first entry that says so. Explicit,
#             because a degree or a prize also has a start and no end.
#   location  city, country
#   note      one short line, e.g. a thesis title (or a `cards` summary)
#   details   bullets; plain text unless one embeds a markdown link,
#             "Reviewer for [ACM TOSEM](https://…)", which renders as one.
#   minor     true sends the entry to a collapsed "N more" disclosure at the end
#             of the section, for a long run of repeated low-value entries.
#   highlights  chips under a `cards` entry.
#   semester    a `courses` entry's term, e.g. "WS 26/27" or "SS 2026".
#   type        a `courses` entry's kind, e.g. "Lecture / Practice".

summary: >-
  Advocate, magistrate and translator. Brought Greek philosophy into Latin, and
  in the process supplied much of the technical vocabulary European philosophy
  still runs on.

interests:
  - Rhetoric
  - Stoic & Academic philosophy
  - Roman constitutional law
  - Latin philosophical vocabulary

sections:
  - id: experience
    heading: Experience
    entries:
      - title: Writing and private study
        org: Tusculum
        start: '46 BC'
        current: true
        details:
          - Composed the philosophical works in under two years.
          - Corresponded with Atticus at a rate that has no modern equivalent.

      - title: Proconsul
        org: Province of Cilicia
        start: '51 BC'
        end: '50 BC'
        location: Cilicia
        details:
          - Administered the province and, reluctantly, commanded in the field.

      - title: Consul
        org: Roman Republic
        start: '63 BC'
        end: '62 BC'
        location: Rome
        note: Suppression of the Catilinarian conspiracy
        details:
          - Delivered the four Catilinarian orations.
          - Executed five conspirators without trial — the decision that led to exile five years later.

      - title: Praetor
        org: Roman Republic
        start: '66 BC'
        end: '66 BC'
        location: Rome

      - title: Quaestor
        org: Roman Republic
        start: '75 BC'
        end: '75 BC'
        location: Lilybaeum, Sicily

      # The `minor` case: five recurring courtroom appearances, kept on the page
      # but not beside a consulship.
      - title: Advocate
        org: Roman law courts
        start: '80 BC'
        end: '80 BC'
        minor: true
        note: 'Pro Roscio Amerino — defended Sextus Roscius against a charge of parricide.'

      - title: Advocate
        org: Roman law courts
        start: '70 BC'
        end: '70 BC'
        minor: true
        note: 'In Verrem — prosecuted the former governor of Sicily for corruption.'

      - title: Advocate
        org: Roman law courts
        start: '66 BC'
        end: '66 BC'
        minor: true
        note: 'Pro Cluentio — defended Aulus Cluentius against a charge of poisoning.'

      - title: Advocate
        org: Roman law courts
        start: '62 BC'
        end: '62 BC'
        minor: true
        note: 'Pro Sulla — defended Publius Sulla against a charge of conspiracy.'

      - title: Advocate
        org: Roman law courts
        start: '56 BC'
        end: '56 BC'
        minor: true
        note: 'Pro Caelio — defended Marcus Caelius Rufus.'

  - id: education
    heading: Education
    entries:
      - title: Rhetoric and philosophy
        org: Rhodes and Athens
        start: '79 BC'
        end: '77 BC'
        note: Studied under Molon of Rhodes and Antiochus of Ascalon.

      - title: Law
        org: Rome
        start: '90 BC'
        note: Under Quintus Mucius Scaevola.

  - id: teaching
    heading: Rhetorical instruction
    layout: courses
    # The one section that names a `count`: a teaching record is partly a claim
    # about volume, so "6 courses" earns its place beside the heading.
    count: course|courses
    entries:
      - title: Rhetorica ad discipulos
        type: Declamation practice
        semester: 'WS 46/45'
        url: https://en.wikipedia.org/wiki/Rhetorica_ad_Herennium

      - title: Advocacy practicum
        type: Practicum
        semester: 'WS 46/45'

      - title: De Officiis seminar
        type: Seminar
        semester: 'SS 46'

      - title: Forensic composition
        type: Practicum
        semester: 'WS 45/44'

      - title: De Oratore readings
        type: Seminar
        semester: 'SS 45'

      - title: Rhetorica ad discipulos
        type: Declamation practice
        semester: 'WS 44/43'

  - id: projects
    heading: Projects
    layout: cards
    entries:
      - title: De Re Publica
        note: A dialogue reconstructing the ideal constitution of Rome, modelled on Plato and adapted to Roman practice.
        start: '54 BC'
        highlights:
          - Political theory
          - Dialogue form
        url: https://en.wikipedia.org/wiki/De_re_publica_(Cicero)

      - title: Academy at Tusculum
        note: A private library and philosophical circle, built to translate Greek schools of thought into a Latin vocabulary that did not yet exist.
        start: '55 BC'
        highlights:
          - Translation
          - Stoicism
          - Academic Skepticism

      - title: Corpus of forensic speeches
        note: Assembling and revising the courtroom speeches for publication, so the arguments would outlast the cases.
        start: '80 BC'
        highlights:
          - Rhetoric
          - Publication

  - id: awards
    heading: Honours
    entries:
      - title: Pater Patriae
        org: Roman Senate
        start: '63 BC'
        note: Voted after the conspiracy.

  - id: community
    heading: Public life
    entries:
      - title: Augur
        org: College of Augurs
        start: '53 BC'
        note: Elected to one of the four great priestly colleges.

      - title: Correspondent
        details:
          - 'Extensive correspondence with [Atticus](https://en.wikipedia.org/wiki/Titus_Pomponius_Atticus), later published as the Epistulae ad Atticum.'
          - 'Exchanged letters with [Julius Caesar](https://en.wikipedia.org/wiki/Julius_Caesar) even after backing the opposing side in the civil war.'

  - id: languages
    heading: Languages
    entries:
      - title: Latin
        note: Native
      - title: Greek
        note: Fluent — read, wrote and argued in it
