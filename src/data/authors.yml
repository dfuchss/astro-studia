# Every author who appears anywhere on the site: in a publication's author
# list, on a paper page, or as a member in people.yml.
#
# The key is what everything else references. `orcid` may be null — it renders
# as a link beside the name when set and is omitted when not, which is the
# common case for historical figures and for co-authors who never registered.
#
# Adding a co-author is one row here. Nothing else needs to know about them.
#
# DEMO CONTENT.

cicero:
  name: Marcus Tullius Cicero
  orcid: null

# --- Cicero's circle: the people on /people/ -------------------------------
atticus:
  name: Titus Pomponius Atticus
  orcid: null

tiro:
  name: Marcus Tullius Tiro
  orcid: null

quintus:
  name: Quintus Tullius Cicero
  orcid: null

# --- modern editors and translators, from the entries in papers.bib --------
keyes:
  name: Clinton Walker Keyes
  orcid: null

miller:
  name: Walter Miller
  orcid: null

rackham:
  name: Harris Rackham
  orcid: null

sutton:
  name: Edward William Sutton
  orcid: null

king:
  name: John Edward King
  orcid: null

shackleton_bailey:
  name: David Roy Shackleton Bailey
  orcid: null

# The one invented person in this demo, and the only author here with an ORCID.
# She exists so that every integration the template supports has something to
# render: the ORCID link on a paper page, a fully-populated /people/ entry, and
# an author name that links back to it.
#
# The ORCID is real and resolves — 0000-0002-1825-0097 is Josiah Carberry, the
# deliberately fictional researcher ORCID maintains for exactly this purpose.
# Replace it with your own and the link keeps working.
marek:
  name: Livia Marek
  orcid: 0000-0002-1825-0097
