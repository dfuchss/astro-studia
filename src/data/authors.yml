# Every author who appears anywhere on the site: in a publication's author
# list, on a paper page, or as a member in people.yml. DEMO CONTENT.
#
# The key is what everything else references. `orcid` may be null — it renders
# as a link beside the name when set and is omitted when not, the common case
# for historical figures. Adding a co-author is one row here and nothing else.

cicero:
  name: Marcus Tullius Cicero
  orcid: null

# --- Cicero's circle -------------------------------------------------------
atticus:
  name: Titus Pomponius Atticus
  orcid: null

tiro:
  name: Marcus Tullius Tiro
  orcid: null

quintus:
  name: Quintus Tullius Cicero
  orcid: null

# --- modern editors and translators, from the entries in papers.bib --------
keyes:
  name: Clinton Walker Keyes
  orcid: null

miller:
  name: Walter Miller
  orcid: null

rackham:
  name: Harris Rackham
  orcid: null

sutton:
  name: Edward William Sutton
  orcid: null

king:
  name: John Edward King
  orcid: null

shackleton_bailey:
  name: David Roy Shackleton Bailey
  orcid: null

# The one invented person here, and the only author with an ORCID, so that the
# ORCID link and a fully-populated /people/ entry have something to render. The
# id is ORCID's fictional demo researcher and resolves; replace it with yours.
marek:
  name: Livia Marek
  orcid: 0000-0002-1825-0097
