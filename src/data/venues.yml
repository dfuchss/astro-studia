# Venue badges, keyed by the `abbr` field in papers.bib. DEMO CONTENT — edition
# series, because the demo bibliography is classical. An abbr with no row here
# FAILS THE BUILD: content.config.ts declares it as reference('venues'), so a
# typo is a build error naming the BibTeX key. A paper with no abbr renders
# without a badge, which is fine.
#
# `color` is the venue's own brand hex, pasted as-is: VenueBadge.astro mixes it
# toward white for the label and toward the page for the fill. Do not pre-lighten.

LCL:
  name: Loeb Classical Library
  url: https://www.loebclassics.com/
  color: '#8b2332'

OCT:
  name: Oxford Classical Texts
  url: https://global.oup.com/academic/content/series/o/oxford-classical-texts-oct/
  # Oxford blue: too dark to read as text here, left unaltered to prove the point.
  color: '#002147'

CUP:
  name: Cambridge Texts in the History of Political Thought
  url: https://www.cambridge.org/
  color: '#d6083b'

Teubner:
  name: Bibliotheca Teubneriana
  color: '#4a5c3d'
