# The people shown at /people/. DEMO CONTENT.
#
# The KEY IS THE ANCHOR: `cicero` here is /people/#cicero, and that is what an
# author name in the publication list links to — renaming a key changes a URL.
# `author` points at a row in authors.yml, which holds the name and the ORCID.
# `surnames` is how a name parsed out of papers.bib is matched back to this
# person, so list every form they publish under, including a previous name.

cicero:
  author: cicero
  order: 1
  role: Author
  image: ../assets/people/cicero.svg
  surnames: [Cicero]

atticus:
  author: atticus
  order: 2
  role: Correspondent
  image: ../assets/people/atticus.svg
  surnames: [Atticus, Pomponius]

tiro:
  author: tiro
  order: 3
  role: Secretary
  image: ../assets/people/tiro.svg
  surnames: [Tiro]

# The fully-configured case: every optional field set, so each has somewhere to
# render.
marek:
  author: marek
  order: 4
  role: Editor
  image: ../assets/people/marek.svg
  email: l.marek@example.org
  url: https://example.org/marek
  github: octocat
  surnames: [Marek]
