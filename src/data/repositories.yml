# What /repositories/ lists. DEMO VALUES — the shipped ones exist, so that
# `npm run data:github` works on a fresh clone.
#
# Nothing is fetched at build time: `npm run data:github` reads this file, calls
# the GitHub API and writes the committed src/data/github-metadata.json, so the
# build stays hermetic, offline and token-free. Add a repo, run it, commit both
# files; .github/workflows/update-github-metadata.yml does it on a schedule.

github_users:
  - octocat

github_repos:
  - withastro/astro
  - octocat/Hello-World

# Archived datasets and software releases, listed by DOI. No API call and no
# metadata file — a DOI does not go stale.
zenodo_repos:
  - name: Replication package (example)
    doi: 10.5281/zenodo.10000000
