# The groups /projects/ sorts its entries into. A project's `category` is one
# of these ids — a `reference()`, so a misspelt one fails the build — and adding
# a group is one entry here. Groups render by `order`, lower first: the file()
# loader does not keep this file's order.
#
# Leave `category` off every project for one flat list with no headings; an
# entry without one, on a site where others have one, gathers under the final
# "Other" group, whose words are `other` in src/content/pages/projects.md.
- id: research
  order: 1
  label: Research
  blurb: Long-running lines of work.
- id: tools
  order: 2
  label: Tools
  blurb: Things built to be used by someone else.
- id: misc
  order: 3
  label: Elsewhere
  blurb: Work that lives on another site.
